[identity]
service = "tkda-desktop-cli"
type_name = "DesktopCliEnv"

[help]
url = "https://github.com/takoda-automation/tkda-desktop-cli"

[parse]
allow_unknown = false

[env]
ignore = [
  "TKDA_LOCAL_CONTROL_TOKEN",
  "TKDA_LOCAL_CONTROL_TOKEN_FILE"
]

[flags.command]
env = "TKDA_DESKTOP_COMMAND"
aliases = ["command"]
type = "string"
default = "status"
help = "Local command: status, run, run-status, run-cancel, or keep-awake."

[flags.daemon-url]
env = "TKDA_LOCAL_CONTROL_URL"
aliases = ["daemon-url"]
type = "string"
default = "http://127.0.0.1:18087"
help = "Credential-free loopback tkda-desktop-daemon origin."

[flags.run-file]
env = "TKDA_RUN_FILE"
aliases = ["run-file"]
type = "string"
help = "JSON run request file for --command=run."

[flags.run-id]
env = "TKDA_RUN_ID"
aliases = ["run-id"]
type = "string"
help = "Run UUID for run-status or run-cancel."

[flags.enabled]
env = "TKDA_KEEP_AWAKE_ENABLED"
aliases = ["enabled"]
type = "boolean"
default = false
help = "Desired keep-awake state for --command=keep-awake."
