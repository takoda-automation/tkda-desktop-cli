[package]
name = "tkda-desktop-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local operator CLI for tkda-desktop-daemon"

[dependencies]
anyhow = "1"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "5a44d6a38f06c2765e80676618fd72bf4e59b984" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
